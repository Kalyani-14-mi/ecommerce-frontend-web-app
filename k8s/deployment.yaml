apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  labels:
    app: ecommerce-frontend
spec:
  replicas: 1          # reduce to 1 until stable; you have 4 pods fighting for memory
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
        - name: ecommerce-frontend
          image: xennit/ecommerce-frontend-web-app:latest
          ports:
            - containerPort: 4200
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"      # raised from 512Mi — Angular/Node needs more headroom
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 90   # was 30s — give the app time to actually start
            periodSeconds: 15
            timeoutSeconds: 5         # was 1s — too tight for a slow response
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 60   # was 15s
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
